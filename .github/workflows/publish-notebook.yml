name: 发布研究汇总页

# 定时刷新全部卡片（deep-dive 数据面 + 扫描留痕）→ 生成小红书样式汇总页
# → 发布到 GitHub Pages。外部接口对海外 IP 可能限流：各面独立成败，
# 失败的卡片沿用仓库里上一次的数据，页面不会空。
on:
  schedule:
    - cron: "0 0 * * 1-5"     # 北京时间 08:00，工作日（A 股交易日）
  workflow_dispatch:           # 手动触发：Actions 页面 → Run workflow

permissions:
  contents: write              # 刷新后的卡片要提交回仓库（数据保鲜）
  pages: write
  id-token: write

concurrency:
  group: publish-notebook
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # ubuntu-26.04 runner 无 3.9；代码为 3.9+ 语法
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 数据接口缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pickahkstock
          key: pickahk-cache-${{ github.run_id }}
          restore-keys: pickahk-cache-

      - name: 测试（178 项，先于发布暴露运行时不兼容）
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: python -m unittest discover -s tests

      - name: 刷新全部卡片（数据面 + 扫描留痕）
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: |
          for f in cards/A_*.json cards/HK_*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .json)
            market=${base%%_*}
            code=${base#*_}
            echo "== $market $code"
            # 海外 IP 访问国内接口慢：单卡 6 分钟上限，卡住就放弃这张，
            # 卡片沿用仓库里的上一次数据（deep-dive 各面独立成败）
            timeout 360 python -m research.cli deep-dive "$market" "$code" || echo "!! $market $code 超时/失败，沿用仓库数据"
          done

      - name: 发现层新候选自动立项（不靠手动）
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: |
          # A 股新候选：从最新报告期的 odds 筛选中，取结构条件通过且没有已有卡的
          python -m research.cli odds --period 2026-09-30 --limit 10 2>/dev/null | \
            grep -oE "^[A-Za-z]+ [0-9]{6} " | while read market code _; do
              [ -f "cards/${market}_${code}.json" ] && continue
              echo "== 新候选立项 $market $code"
              timeout 300 python -m research.cli new --codes "$code" 2>/dev/null || true
            done
          # 港股新候选：最近 60 天的盈警/盈喜
          python -m research.cli hk-discover --source alerts --days 60 --limit 5 2>/dev/null | \
            grep -oE "^. ([0-9]{5}) " | sed 's/^. //' | while read code; do
              [ -f "cards/HK_${code}.json" ] && continue
              echo "== 港股新候选立项 HK $code"
              timeout 300 python -m research.cli new --market HK --codes "$code" 2>/dev/null || true
            done

      - name: 生成单卡笔记与汇总页
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: |
          for f in cards/A_*.json cards/HK_*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .json)
            market=${base%%_*}
            code=${base#*_}
            python -m research.cli note "$market" "$code" || true
          done
          python -m research.cli notebook

      - name: 提交刷新后的卡片（best-effort：撞车不挡发布）
        run: |
          git config user.name "research-bot"
          git config user.email "actions@github.com"
          git add cards/
          if git diff --cached --quiet; then
            echo "卡片无变化，跳过提交"
            exit 0
          fi
          git commit -m "CI 数据刷新：deep-dive 全卡（自动，判断字段不受影响）"
          # 别人在运行期间推了提交时 rebase 重放；仍失败就放弃提交但不挡发布
          # （Pages 用的是本次工作区生成的 notes，不依赖这份提交）
          git pull --rebase origin master && git push || \
            echo "!! 提交刷新数据失败（推送撞车），页面照常发布，数据下次再留"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cards/notes

      - id: deploy
        uses: actions/deploy-pages@v4
